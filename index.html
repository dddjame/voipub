<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Військовий юрист</title>
</head>
<body>
<script>
const TELEGRAM_URL = "https://t.me/ВАШ_USERNAME";

(function() {
  function createEl(tag, styles = {}, text = "") {
    const el = document.createElement(tag);
    el.style.boxSizing = "border-box";
    Object.assign(el.style, styles);
    if (text) el.textContent = text;
    return el;
  }

  document.documentElement.style.height = "100%";
  Object.assign(document.body.style, {
    margin: "0",
    padding: "16px",
    minHeight: "100vh",
    minHeight: "100dvh",
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
    backgroundColor: "#0d120c",
    backgroundImage: "radial-gradient(circle at 50% 18%, rgba(95, 128, 62, 0.22) 0%, transparent 60%), radial-gradient(circle at 80% 80%, rgba(42, 171, 238, 0.08) 0%, transparent 50%), linear-gradient(165deg, #11170f 0%, #0d120c 100%)",
    color: "#f1f3ec",
    webkitTapHighlightColor: "transparent"
  });

  const card = createEl("div", {
    width: "100%",
    maxWidth: "420px",
    background: "rgba(26, 35, 23, 0.75)",
    backdropFilter: "blur(16px)",
    webkitBackdropFilter: "blur(16px)",
    border: "1px solid rgba(175, 195, 140, 0.2)",
    borderRadius: "24px",
    padding: "40px 28px",
    display: "flex",
    flexDirection: "column",
    alignItems: "center",
    textAlign: "center",
    boxShadow: "0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1)"
  });

  card.animate(
    [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "translateY(0)" }],
    { duration: 400, easing: "ease-out", fill: "forwards" }
  );

  const topBadge = createEl("div", {
    display: "inline-flex",
    alignItems: "center",
    gap: "7px",
    fontSize: "12px",
    fontWeight: "600",
    letterSpacing: "0.8px",
    textTransform: "uppercase",
    color: "#c9d8ab",
    background: "rgba(140, 168, 95, 0.12)",
    border: "1px solid rgba(170, 195, 130, 0.28)",
    borderRadius: "999px",
    padding: "6px 14px",
    marginBottom: "20px"
  });

  const dot = createEl("span", {
    width: "7px",
    height: "7px",
    background: "#4ade80",
    borderRadius: "50%",
    boxShadow: "0 0 8px #4ade80",
    flexShrink: "0"
  });

  dot.animate(
    [{ opacity: 1, transform: "scale(1)" }, { opacity: 0.4, transform: "scale(0.85)" }, { opacity: 1, transform: "scale(1)" }],
    { duration: 2000, iterations: Infinity, easing: "ease-in-out" }
  );

  topBadge.appendChild(dot);
  topBadge.appendChild(document.createTextNode("⚖️ Військовий юрист онлайн"));

  const title = createEl("h1", {
    fontSize: "26px",
    fontWeight: "800",
    lineHeight: "1.25",
    margin: "0 0 14px 0",
    letterSpacing: "-0.3px",
    color: "#ffffff"
  }, "Професійна правова допомога військовим");

  const desc = createEl("p", {
    fontSize: "15px",
    color: "#bac2b0",
    lineHeight: "1.55",
    margin: "0 0 22px 0"
  }, "Консультація з будь-яких питань: відстрочка, ВЛК, рапорти, виплати, бойові та звільнення зі служби.");

  const freePill = createEl("div", {
    display: "inline-flex",
    alignItems: "center",
    background: "linear-gradient(135deg, #4d6d2b 0%, #3e5a20 100%)",
    color: "#f7fee7",
    fontWeight: "600",
    fontSize: "13px",
    padding: "6px 16px",
    borderRadius: "999px",
    marginBottom: "26px",
    border: "1px solid rgba(255, 255, 255, 0.15)",
    boxShadow: "0 4px 12px rgba(60, 90, 30, 0.35)"
  }, "Первинна консультація — безкоштовно");

  const btn = createEl("a", {
    display: "flex",
    alignItems: "center",
    justifyContent: "center",
    gap: "12px",
    width: "100%",
    background: "linear-gradient(135deg, #2bb2f4 0%, #1d95d6 100%)",
    color: "#ffffff",
    textDecoration: "none",
    fontSize: "17px",
    fontWeight: "700",
    padding: "17px 20px",
    borderRadius: "16px",
    boxShadow: "0 10px 28px rgba(35, 160, 225, 0.45)",
    transition: "transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease, filter 0.2s ease",
    cursor: "pointer"
  });

  btn.href = TELEGRAM_URL;
  btn.target = "_blank";
  btn.rel = "noopener noreferrer";

  btn.onmouseenter = () => {
    btn.style.transform = "translateY(-2px)";
    btn.style.boxShadow = "0 14px 34px rgba(35, 160, 225, 0.6)";
    btn.style.filter = "brightness(1.05)";
  };
  btn.onmouseleave = () => {
    btn.style.transform = "translateY(0)";
    btn.style.boxShadow = "0 10px 28px rgba(35, 160, 225, 0.45)";
    btn.style.filter = "none";
  };
  btn.onmousedown = () => { btn.style.transform = "translateY(1px)"; };
  btn.onmouseup = () => { btn.style.transform = "translateY(-2px)"; };

  btn.innerHTML = `
    <svg style="width:22px;height:22px;fill:#ffffff;flex-shrink:0;" viewBox="0 0 24 24">
      <path d="M9.04 15.5l-.38 5.36c.55 0 .79-.24 1.08-.52l2.6-2.48 5.38 3.94c.99.55 1.69.26 1.96-.9L23.9 4.6c.32-1.4-.51-1.95-1.43-1.61L1.6 11.1c-1.37.53-1.35 1.3-.23 1.65l5.5 1.7L19.1 6.9c.58-.38 1.1-.17.67.21L9.04 15.5z"/>
    </svg>
    Перейти в Telegram
  `;

  const footerNote = createEl("p", {
    marginTop: "18px",
    marginBottom: "0",
    fontSize: "12.5px",
    color: "#8c9580"
  });
  footerNote.innerHTML = 'Відповідаємо протягом 5 хв <span style="margin:0 6px;opacity:0.5;">•</span> Конфіденційно';

  card.appendChild(topBadge);
  card.appendChild(title);
  card.appendChild(desc);
  card.appendChild(freePill);
  card.appendChild(btn);
  card.appendChild(footerNote);

  document.body.appendChild(card);
})();
</script>
</body>
</html>
